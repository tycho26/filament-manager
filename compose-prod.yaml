services:
  web-prod:
    build:
        context: .
        dockerfile: Dockerfile-prod
    image: "filament-manager-web-prod:latest"
    # volumes:
    #   - ./:/app:z
    ports:
      - "3001:3000"
    # command: ["npm", "-v"]
    environment:
      - DATABASE_URL=mysql://root:1234@db:3306/filament-manager-db-prod
      - APP_ENV=production
    depends_on:
      - db
  db:
    image: "mariadb:latest"
    ports:
      - "3306:3306" 
    environment:
      - MARIADB_ROOT_PASSWORD=1234
      - MARIADB_DATABASE=filament-manager-db-prod
    volumes:
      - filament-manager-db-prod:/var/lib/mysql


volumes:
  filament-manager-db-prod:
